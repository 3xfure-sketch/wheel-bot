<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #e2b007;
            box-shadow: 0 0 20px rgba(226, 176, 7, 0.5);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 10;
        }
        button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #2ed573;
        }
    </style>
</head>
<body>

    <h2>Колесо Фортуны 🎡</h2>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" onclick="spin()">ВРАЩАТЬ!</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const sectors = ["100 $", "Попробуй еще", "500 $", "Джекпот!", "0 $", "50 $"];
        const colors = ["#ff4757", "#2ed573", "#1e90ff", "#ffa502", "#9b59b6", "#eccc68"];
        
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const numSectors = sectors.length;
            const arc = (2 * Math.PI) / numSectors;

            for (let i = 0; i < numSectors; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + arc);
                ctx.lineTo(150, 150);
                ctx.fill();

                // Текст
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px Arial";
                ctx.fillText(sectors[i], 130, 5);
                ctx.restore();
            }
        }

        drawWheel();

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('result').innerText = "";

            const spinAngle = Math.floor(Math.random() * 360) + 1440; // Минимум 4 оборота
            const duration = 4000;
            const start = performance.now();

            function animate(time) {
                let elapsed = time - start;
                let progress = Math.min(elapsed / duration, 1);
                // Замедление к концу
                let easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = (easeOut * spinAngle * Math.PI / 180) % (2 * Math.PI);
                ctx.clearRect(0, 0, 300, 300);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById('result').innerText = "Поздравляем!";
                }
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
