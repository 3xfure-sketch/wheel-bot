<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Content Wheel TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #12141c; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 12px; text-align: center; overflow-x: hidden;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e2230; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; font-size: 14px;
        }
        .balance-badge { background: #2b3145; padding: 6px 12px; border-radius: 20px; font-weight: bold; color: #ffd700; }
        .roulette-wrapper {
            position: relative; width: 100%; height: 140px; background: #151824;
            border: 2px solid #2b3145; border-radius: 14px; overflow: hidden; margin: 15px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%; background: #ff4757; z-index: 10; box-shadow: 0 0 10px #ff4757;
        }
        .pointer::before {
            content: ''; position: absolute; top: 0; left: -6px;
            border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #ff4757;
        }
        .tape { display: flex; position: absolute; left: 0; top: 10px; height: 120px; will-change: transform; }
        .case-item {
            width: 100px; height: 110px; background: #1e2230; margin: 0 4px; border-radius: 8px;
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-bottom: 4px solid #4b69ff; box-sizing: border-box; padding: 5px;
        }
        .case-item .item-title { font-size: 11px; font-weight: 600; color: #ddd; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-spin {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none;
            width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }
        .prize-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .prize-box { background: #1e2230; padding: 25px; border-radius: 16px; border: 2px solid #ffd700; text-align: center; max-width: 300px; }
    </style>
</head>
<body>
    <div class="header">
        <div>👤 ID: <span id="user-id">...</span></div>
        <div class="balance-badge">⭐ <span id="balance">0</span> spins</div>
    </div>

    <h3>🎁 Content Wheel</h3>

    <div class="roulette-wrapper" id="roulette-wrapper">
        <div class="pointer"></div>
        <div class="tape" id="tape"></div>
    </div>

    <button class="btn-spin" id="spin-btn" onclick="startSpin()">🚀 SPIN WHEEL</button>

    <div class="prize-modal" id="prize-modal">
        <div class="prize-box">
            <h2 style="color: #ffd700; margin-top:0;">🎉 YOU WON!</h2>
            <p id="prize-title" style="font-size: 16px; margin: 15px 0;"></p>
            <p style="font-size: 12px; color: #aaa;">Prize delivered to your Telegram chat!</p>
            <button class="btn-spin" style="background: #2481cc;" onclick="closeModal()">CLAIM</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://stiffly-degrading-dimly.ngrok-free.dev";

        const tg = window.Telegram.WebApp;
        tg.expand();
        let dbItems = [];
        let isSpinning = false;
        const TAPE_ITEMS_COUNT = 70;

        fetch(`${BACKEND_URL}/api/profile`, { 
            headers: { 'Authorization': tg.initData } 
        })
        .then(r => r.json())
        .then(d => {
            document.getElementById('user-id').innerText = d.user_id;
            document.getElementById('balance').innerText = d.balance;
        }).catch(err => console.error("Profile error:", err));

        fetch(`${BACKEND_URL}/api/content_items`)
            .then(r => r.json())
            .then(d => { dbItems = d.items; buildTape(null); })
            .catch(err => console.error("Content error:", err));

        function buildTape(winningItemId) {
            const tape = document.getElementById('tape');
            tape.innerHTML = '';
            for (let i = 0; i < TAPE_ITEMS_COUNT; i++) {
                let item;
                if (i === 50 && winningItemId) {
                    item = dbItems.find(it => it.id === winningItemId) || dbItems[0];
                } else {
                    item = dbItems[i % dbItems.length];
                }
                const div = document.createElement('div');
                div.className = 'case-item';
                div.style.borderColor = item.color;
                div.innerHTML = `<div style="font-size: 30px; margin-bottom: 5px;">🎁</div><div class="item-title">${item.title}</div>`;
                tape.appendChild(div);
            }
        }

        function startSpin() {
            if (isSpinning || dbItems.length === 0) return;

            fetch(`${BACKEND_URL}/api/spin`, { 
                method: 'POST', 
                headers: { 'Authorization': tg.initData } 
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) { tg.showAlert(data.message); return; }

                isSpinning = true;
                document.getElementById('spin-btn').disabled = true;
                buildTape(data.prize_id);

                const tape = document.getElementById('tape');
                tape.style.transition = 'none';
                tape.style.transform = 'translateX(0px)';

                const itemWidth = 108;
                const wrapperWidth = document.getElementById('roulette-wrapper').offsetWidth;
                const targetX = (50 * itemWidth) - (wrapperWidth / 2) + (itemWidth / 2) + (Math.random() * 10 - 5);

                setTimeout(() => {
                    tape.style.transition = 'transform 5s cubic-bezier(0.08, 0.52, 0.15, 1)';
                    tape.style.transform = `translateX(-${targetX}px)`;

                    if (tg.HapticFeedback) {
                        let ticks = 0;
                        const interval = setInterval(() => { 
                            tg.HapticFeedback.impactOccurred('light'); 
                            ticks++; 
                            if(ticks > 30) clearInterval(interval); 
                        }, 130);
                    }
                }, 50);

                setTimeout(() => {
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;
                    document.getElementById('balance').innerText = data.balance;
                    document.getElementById('prize-title').innerText = data.title;
                    document.getElementById('prize-modal').style.display = 'flex';
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }, 5250);
            })
            .catch(err => {
                isSpinning = false;
                document.getElementById('spin-btn'].disabled = false;
                tg.showAlert("Server connection error!");
            });
        }
        function closeModal() { document.getElementById('prize-modal').style.display = 'none'; }
    </script>
</body>
</html>
