<!-- Кнопка вращения -->
<button id="spin-btn" class="spin-button" onclick="spinWheel()">Spin Wheel (1 Spin)</button>

<!-- БЛОК ПОКУПКИ СПИНОВ (Под кнопкой) -->
<div class="buy-spins-container">
    <div class="buy-spins-title">Get More Spins</div>
    <div class="spins-cards-grid">
        <div class="spin-card" onclick="buySpinsPackage(1, 15)">
            <div class="spin-card-count">+1 Spin</div>
            <div class="spin-card-price">⭐ 15</div>
        </div>
        <div class="spin-card popular" onclick="buySpinsPackage(5, 50)">
            <div class="popular-badge">POPULAR</div>
            <div class="spin-card-count">+5 Spins</div>
            <div class="spin-card-price">⭐ 50</div>
        </div>
        <div class="spin-card" onclick="buySpinsPackage(10, 90)">
            <div class="spin-card-count">+10 Spins</div>
            <div class="spin-card-price">⭐ 90</div>
        </div>
    </div>
</div>
