<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        h2 {
            margin-bottom: 20px;
            color: #fbc531;
            text-shadow: 0 0 10px rgba(251, 197, 49, 0.4);
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #fbc531;
            box-shadow: 0 0 25px rgba(251, 197, 49, 0.3);
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid #e1b12c;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        button {
            margin-top: 30px;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #121212;
            background: linear-gradient(45deg, #fbc531, #4cd137);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(76, 209, 55, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #4cd137;
            min-height: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Колесо Фортуны 🎡</h2>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="spinBtn" onclick="spin()">КРУТИТЬ КОЛЕСО!</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно на весь экран

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const sectors = ["100 $", "Попробуй еще", "500 $", "Джекпот!", "0 $", "50 $"];
        const colors = ["#e84118", "#00a8ff", "#9c88ff", "#fbc531", "#487eb0", "#4cd137"];
        
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const numSectors = sectors.length;
            const arc = (2 * Math.PI) / numSectors;

            for (let i = 0; i < numSectors; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 160, angle, angle + arc);
                ctx.lineTo(160, 160);
                ctx.fill();

                // Отрисовка текста
                ctx.save();
                ctx.translate(160, 160);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.fillText(sectors[i], 140, 6);
                ctx.restore();
            }
        }

        drawWheel();

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').style.opacity = '0.5';
            document.getElementById('result').innerText = "";

            const winningIndex = Math.floor(Math.random() * sectors.length);
            const numSectors = sectors.length;
            const sectorArc = (2 * Math.PI) / numSectors;
            
            // Расчет угла остановки
            const targetSectorAngle = (2 * Math.PI) - (winningIndex * sectorArc) - (sectorArc / 2);
            const extraRounds = 5 * 2 * Math.PI; // 5 полных оборотов
            const totalTargetAngle = currentAngle + extraRounds + (targetSectorAngle - (currentAngle % (2 * Math.PI)));

            const duration = 4500;
            const start = performance.now();

            function animate(time) {
                let elapsed = time - start;
                let progress = Math.min(elapsed / duration, 1);
                let easeOut = 1 - Math.pow(1 - progress, 4); // Плавное замедление
                
                currentAngle = easeOut * totalTargetAngle;
                ctx.clearRect(0, 0, 320, 320);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    const prize = sectors[winningIndex];
                    document.getElementById('result').innerText = "Вы выиграли: " + prize + "!";
                    
                    // Отправляем результат обратно в бота через 1.5 секунды
                    setTimeout(() => {
                        tg.sendData(JSON.stringify({
                            prize: prize,
                            user_id: tg.initDataUnsafe?.user?.id
                        }));
                    }, 1500);
                }
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
