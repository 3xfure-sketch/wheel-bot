<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Spin Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 75px;
            user-select: none;
        }
        
        .profile-header {
            width: 100%;
            background: #1e293b;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .profile-info span { color: #f59e0b; font-weight: bold; }

        .page {
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }
        .page.active { display: flex; }

        h2 { margin-bottom: 6px; color: #f59e0b; text-align: center; font-size: 22px; }
        .sub-title { font-size: 13px; color: #94a3b8; margin-bottom: 12px; text-align: center; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .menu-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 14px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .menu-card:active { transform: scale(0.96); background: #334155; }
        .menu-card.full { grid-column: span 2; }
        .menu-icon { font-size: 22px; }

        .wheel-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 15px 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ef4444;
            z-index: 10;
        }
        .preview-card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85px; height: 85px;
            border-radius: 50%;
            background: #1e293b;
            border: 3px solid #f59e0b;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .blur-content {
            width: 100%; height: 100%;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            filter: blur(8px) brightness(0.6);
            transition: filter 0.5s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; text-align: center; padding: 4px;
            color: white;
        }
        .preview-card.unlocked .blur-content { filter: blur(0px) brightness(1); }
        .lock-icon { position: absolute; font-size: 18px; z-index: 6; }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            background: linear-gradient(135deg, #f59e0b, #10b981);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { opacity: 0.9; transform: scale(0.98); }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
            margin-top: 10px;
        }

        .navbar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: #94a3b8;
            font-size: 12px; display: flex; flex-direction: column;
            align-items: center; gap: 4px; cursor: pointer;
        }
        .nav-item.active { color: #f59e0b; }
        .nav-icon { font-size: 18px; }

        #resultMsg { margin-top: 10px; font-weight: bold; color: #10b981; min-height: 24px; text-align: center; }
    </style>
</head>
<body>

            </div>
            <canvas id="wheel" width="280" height="280"></canvas>
